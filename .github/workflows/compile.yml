name: Compile Novia Home

on: [push, pull_request]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core 3.x
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Libraries - Cara git clone
        run: |
          mkdir -p ~/Arduino/libraries
          # Hapus dulu kalau ada sisa yang lama
          rm -rf ~/Arduino/libraries/ESPAsyncWebServer
          rm -rf ~/Arduino/libraries/AsyncTCP
          
          # Clone versi baru yang support Core 3.x
          git clone https://github.com/ESP32Async/ESPAsyncWebServer.git ~/Arduino/libraries/ESPAsyncWebServer
          git clone https://github.com/ESP32Async/AsyncTCP.git ~/Arduino/libraries/AsyncTCP
          
          # Library lain tetep dari Library Manager
          arduino-cli lib install "Blynk" "ArduinoJson"

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 ./noviaHome/noviaHome.ino

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: NoviaHome-firmware
          path: build/**/*.bin
