name: Compile Novia Home V3

on:
  push:
    branches:
      - novia-home-v3
  pull_request:
    branches:
      - novia-home-v3

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli core update-index

      - name: Install ESP32 Core
        run: |
          arduino-cli core install esp32:esp32
          arduino-cli core list

      - name: Prepare Libraries
        run: |
          mkdir -p ~/Arduino/libraries

          rm -rf ~/Arduino/libraries/ESPAsyncWebServer
          rm -rf ~/Arduino/libraries/AsyncTCP

          git clone --depth 1 \
            https://github.com/ESP32Async/ESPAsyncWebServer.git \
            ~/Arduino/libraries/ESPAsyncWebServer

          git clone --depth 1 \
            https://github.com/ESP32Async/AsyncTCP.git \
            ~/Arduino/libraries/AsyncTCP

      - name: Install Blynk
        run: |
          arduino-cli lib install Blynk
          arduino-cli lib list

      - name: Verify Sketch
        run: |
          echo "Checking sketch..."

          test -f ./noviaHome/noviaHome.ino

          echo "Sketch ditemukan."
          find ./noviaHome -maxdepth 2 -type f

      - name: Compile ESP32
        run: |
          mkdir -p build-output

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings all \
            --verbose \
            --output-dir ./build-output \
            ./noviaHome/noviaHome.ino

      - name: Upload Firmware Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NoviaHome-V3-Firmware
          path: build-output/
          if-no-files-found: error
          retention-days: 14
